name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m py_compile scripts/*.py examples/*.py
      - name: Build and validate template
        run: |
          mkdir -p work
          python scripts/build_from_scene.py assets/templates/scene-template.json work/template.vsdx --manifest work/template.manifest.json
          python scripts/validate_vsdx.py work/template.vsdx --output work/template.validation.json
      - name: Validate bundled Gold Standard
        run: python scripts/validate_vsdx.py assets/gold/synthetic_event_routing_editable.vsdx
